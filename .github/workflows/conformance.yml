name: conformance

# SSO-3092 (epic SSO-3087) — nightly + on-demand recipe conformance against STAGING. Every catalog recipe
# is applied (which converges its provision file first), verified, and torn down, as a real customer:
# sign-in from .thoryn/connection.json, the released CLI jar, no DB seed, no bundled test recipe (the
# bundled ci-signin + the legacy THORYN_API_KEY secret are retired). Each sandbox-plane recipe gets a
# throwaway sandbox named for the run; simple-signin (production plane) applies a client + demo user
# there and tears them down. A red recipe blocks a catalog release.

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: "A single recipe id to run (default: every recipe with a provision file)"
        required: false
        default: ""
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: example-e2e
  cancel-in-progress: false

env:
  THORYN_HUB: https://hub.stg.thoryn.org
  THORYN_CI_PLAINTEXT_TOKENS: "1"

jobs:
  conformance:
    name: recipe conformance (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download the released thoryn CLI (latest cli-v*)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo thoryn-io/thoryn-cli --limit 40 --json tagName -q '.[].tagName' | grep '^cli-v' | head -1)"
          gh release download "$tag" --repo thoryn-io/thoryn-cli --pattern 'thoryn.jar' --dir .
          echo "Using CLI release $tag"
      - name: Sign in (connection contract)
        env:
          THORYN_EXAMPLES_CI_CLIENT_SECRET: ${{ secrets.THORYN_EXAMPLES_CI_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          java -jar thoryn.jar login --connection .thoryn/connection.json
          java -jar thoryn.jar login --status
      - name: Update the signed recipe catalog
        run: java -jar thoryn.jar examples update
      - name: Apply → verify → teardown every recipe
        env:
          ONLY: ${{ github.event.inputs.recipe }}
        run: |
          set -uo pipefail
          slug="$(jq -r '.workspace.slug' .thoryn/connection.json)"
          pw="Ex-$(openssl rand -hex 12)!"; echo "::add-mask::$pw"; export DEMO_USER_PASSWORD="$pw"
          fail=0
          for d in recipes/*/; do
            id="$(basename "$d")"
            [ -f "$d/provision.yaml" ] || continue
            [ -z "$ONLY" ] || [ "$ONLY" = "$id" ] || continue
            echo "::group::$id"
            args=(examples apply "$id" --set "workspaceSlug=$slug" --yes)
            if grep -q 'kind: environment' "$d/provision.yaml"; then
              args+=(--set "envSlug=conf-${id:0:12}-${GITHUB_RUN_ID}")
            else
              args+=(--set "demoEmail=conf-${GITHUB_RUN_ID}@example.com" --environment production)
            fi
            if java -jar thoryn.jar "${args[@]}" && java -jar thoryn.jar examples verify "$id"; then
              echo "✓ $id"
            else
              echo "::error::recipe $id failed on staging"; fail=1
            fi
            java -jar thoryn.jar examples teardown "$id" || echo "::warning::teardown of $id reported an error"
            echo "::endgroup::"
          done
          exit $fail
