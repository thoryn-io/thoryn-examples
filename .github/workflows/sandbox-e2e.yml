name: sandbox-e2e

# SSO-3091 (epic SSO-3087) — the `sandbox-signin` browser scenario on the PROVISIONING-AS-CODE shape:
#
#   provision Action (thoryn-cli)   sign in from .thoryn/connection.json, converge the scenario's
#                                   FIXTURE file recipes/sandbox-signin/e2e/provision.yaml — a
#                                   throwaway sandbox environment — with `thoryn provision apply`
#   → examples apply                the SAME recipe a customer fetches from the signed catalog,
#                                   applied INTO that sandbox (`--environment`): the loopback client
#   → Playwright journey            self-service sign-up on the hosted login → verification email
#                                   read from the sandbox TEST-INBOX (SSO-3026/3033) → sign in through
#                                   the recipe's loopback RP → /protected
#   → teardown                      `examples teardown` (the client) then `thoryn provision destroy`
#                                   (the sandbox hard-delete cascades whatever the run created in it)
#
# The destroy is THIS workflow's `if: always()` step, not the Action's: a composite Action's steps run
# together, so an Action-side destroy would fire before the journey. The Action is called with
# `destroy: "false"` for exactly that reason.
#
# Real product APIs only, as a real customer: no DB seeding, no demo endpoint, no imperative sign-in
# (the connection contract replaces the THORYN_API_KEY bash login), no imperative provisioning (the
# fixture file replaces per-run `--set envSlug=…` recipe params). The ONLY injected secret is
# THORYN_EXAMPLES_CI_CLIENT_SECRET — the env var `.thoryn/connection.json` names.
#
# Why no Mailpit sink here: a sandbox SUPPRESSES real transactional email and captures it into its
# test-inbox (TestModeEmailGate, SSO-2449), which the journey reads through `thoryn env test-emails`.
# The workspace-plane BYO-SMTP sink the earlier revision configured never carried a sandbox email, so
# it is gone from this workflow (the Mailpit-based scenarios keep theirs).
#
# ONE-TIME OPERATOR SETUP (see `.thoryn/README.md`): mint the CI machine client in the `examples`
# workspace, paste its clientId into `.thoryn/connection.json`, set the repo secret
# THORYN_EXAMPLES_CI_CLIENT_SECRET. The recipe v2 (client only) reaches CI through the SIGNED CATALOG,
# so a catalog release (RELEASING.md) must follow the merge before this workflow is green.

on:
  workflow_dispatch:
  schedule:
    - cron: "5 5 * * *" # nightly, offset from conformance.yml (23 4) and example-e2e.yml (41 4)

permissions:
  contents: write # commit the regenerated E2E_RESULTS.md back (default branch only)

# Serialize with the other scenario workflows: they share the standing workspace.
concurrency:
  group: example-e2e
  cancel-in-progress: false

env:
  THORYN_HUB: https://hub.stg.thoryn.org
  THORYN_GATEWAY: https://api.stg.thoryn.org
  IDENTITY_BASE_URL: https://identity.stg.thoryn.org
  RECIPE: sandbox-signin
  PROVISION_FILE: recipes/sandbox-signin/e2e/provision.yaml
  THORYN_CI_PLAINTEXT_TOKENS: "1"
  RP_PORT: "8471"

jobs:
  sandbox-e2e:
    name: sandbox-e2e (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout thoryn-examples
        uses: actions/checkout@v4

      - name: Set up Node.js (Playwright harness + loopback RP)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The fixture file's environment slug is per run (`{{env.E2E_ENV_SLUG}}` in provision.yaml):
      # the same isolation the SSO-2969 recipe gave, now declared as a fixture and resolved by the CLI.
      - name: Name this run's sandbox
        run: |
          set -euo pipefail
          echo "E2E_ENV_SLUG=sbx-signin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      # ── Provision the FIXTURES as a real customer (thoryn-cli's reusable Action, SSO-3090) ──
      # Sets up Java, downloads the released thoryn.jar into ./thoryn.jar, signs in from the
      # connection contract, `provision plan` + `provision apply --file` the fixture file, and exposes
      # the provisioned ids. destroy: "false" — the destroy is this workflow's last step.
      - name: Provision the scenario fixtures (sandbox environment)
        id: fixtures
        uses: thoryn-io/thoryn-cli/.github/actions/provision@main
        with:
          client-secret: ${{ secrets.THORYN_EXAMPLES_CI_CLIENT_SECRET }}
          secret-env: THORYN_EXAMPLES_CI_CLIENT_SECRET
          connection: .thoryn/connection.json
          file: ${{ env.PROVISION_FILE }}
          hub: ${{ env.THORYN_HUB }}
          destroy: "false"

      # ── Apply the EXAMPLE (the customer's recipe) into the provisioned sandbox ──
      - name: Update the signed recipe catalog (sandbox-signin is NOT bundled in the CLI)
        run: |
          set -euo pipefail
          java -jar thoryn.jar examples update

      - name: Apply the sandbox-signin recipe into the sandbox and resolve issuer/client
        id: apply
        env:
          WORKSPACE_SLUG: ${{ steps.fixtures.outputs.workspace-slug }}
          SANDBOX_ENV_SLUG: ${{ steps.fixtures.outputs.environment }}
        run: |
          set -euo pipefail
          [ -n "$SANDBOX_ENV_SLUG" ] || { echo "::error::the provisioning Action exposed no environment slug"; exit 1; }
          java -jar thoryn.jar examples apply "$RECIPE" \
            --set "workspaceSlug=${WORKSPACE_SLUG}" \
            --environment "$SANDBOX_ENV_SLUG" --yes
          java -jar thoryn.jar examples receipt "$RECIPE" --output json > /tmp/receipt.json
          client="$(jq -r '[.resources[]? | select(.kind=="application") | .id] | first // ""' /tmp/receipt.json)"
          [ -n "$client" ] || { echo "::error::could not parse the clientId from the recipe receipt"; cat /tmp/receipt.json; exit 1; }
          # Per-env issuer = workspace issuer + /{env-slug} path (SecurityConfig, SSO-2411).
          issuer="https://${WORKSPACE_SLUG}.hub.stg.thoryn.org/${SANDBOX_ENV_SLUG}"
          {
            echo "issuer=$issuer"
            echo "client_id=$client"
          } >> "$GITHUB_OUTPUT"
          echo "Applied '$RECIPE' → client '$client' in sandbox '$SANDBOX_ENV_SLUG' of '$WORKSPACE_SLUG' (issuer=$issuer)"

      # ── Run the journey against the recipe's real loopback RP ──
      - name: Start the loopback relying-party
        env:
          THORYN_ISSUER: ${{ steps.apply.outputs.issuer }}
          THORYN_CLIENT_ID: ${{ steps.apply.outputs.client_id }}
          PORT: ${{ env.RP_PORT }}
        run: |
          node recipes/sandbox-signin/apps/loopback-rp/server.js &
          echo "RP_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${RP_PORT}/" >/dev/null 2>&1 && { echo "RP is up"; break; }
            sleep 1
          done

      - name: Run the Playwright harness (Path B — sandbox test-inbox capture)
        env:
          THORYN_ISSUER: ${{ steps.apply.outputs.issuer }}
          THORYN_CLIENT_ID: ${{ steps.apply.outputs.client_id }}
          RP_BASE_URL: http://127.0.0.1:${{ env.RP_PORT }}
          IDENTITY_BASE_URL: ${{ env.IDENTITY_BASE_URL }}
          THORYN_JAR: ${{ github.workspace }}/thoryn.jar
          SANDBOX_ENV_SLUG: ${{ steps.fixtures.outputs.environment }}
          CI: "true"
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run test:sandbox

      - name: Upload Playwright report + generated E2E_RESULTS.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-e2e-playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            recipes/sandbox-signin/E2E_RESULTS.md
          if-no-files-found: warn
          retention-days: 14

      - name: Commit back the generated E2E_RESULTS.md
        if: always() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          FILE=recipes/sandbox-signin/E2E_RESULTS.md
          if git diff --quiet -- "$FILE"; then
            echo "E2E_RESULTS.md unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "thoryn-ci[bot]"
          git config user.email "ci@thoryn.io"
          git add "$FILE"
          git commit -m "chore(e2e): update sandbox-signin E2E_RESULTS.md from CI run ${{ github.run_id }} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # ── Teardown: the example's client, then the fixtures (sandbox hard-delete cascades) ──
      - name: Teardown the client (examples teardown) and the fixtures (provision destroy)
        if: always()
        run: |
          set -uo pipefail
          [ -n "${RP_PID:-}" ] && kill "$RP_PID" 2>/dev/null || true
          [ -f thoryn.jar ] || { echo "no CLI jar — nothing was provisioned"; exit 0; }
          java -jar thoryn.jar examples teardown "$RECIPE" || true
          java -jar thoryn.jar provision destroy --file "$PROVISION_FILE" --yes || \
            echo "::warning::provision destroy reported an error — check 'thoryn env list' for a leaked sandbox '${E2E_ENV_SLUG:-}'"
