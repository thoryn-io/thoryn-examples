# SSO-2969 (epic SSO-2959) — `sandbox-signin` as a true END-USER lifecycle: setup → run → teardown.
#
# `sandbox-signin` gives every run its OWN isolation WITHOUT creating a new workspace. Instead of
# minting a fresh workspace per run (which needs a machine scope a tenant admin can't delegate — the
# SSO-2943 gap), it provisions a throwaway SANDBOX ENVIRONMENT inside a STANDING workspace the caller
# already owns (the one their customer-plane API key is scoped to), provisions a public loopback OAuth
# client INTO that sandbox, registers a sign-in-able user, verifies the client is active, then
# hard-deletes BOTH the client and the sandbox on teardown. Nothing standing is mutated.
#
# It reuses the connection contract's tenant-scoped machine client, which already holds
# `tenant:environments.write/read` alongside the applications scopes — so no new credential and no
# new trust are introduced.
#
# SETUP → RUN → TEARDOWN (the end-user shape this story adds):
#   • `thoryn examples setup sandbox-signin`    — run the `steps` (create the sandbox + app + user).
#   • `thoryn examples run   sandbox-signin`     — launch the `assets.rp` loopback relying party
#                                                  (SSO-2880) pointed at the sandbox's issuer + client,
#                                                  so a user signs in end to end.
#   • `thoryn examples teardown sandbox-signin`  — run `teardown` (delete the app, hard-delete the env).
#
# HOW THE INTERPRETER WIRES IT (thoryn-cli RecipeInterpreter, SSO-2961):
#   • env.create → product-api `POST /api/v1/environments` (`tenant:environments.write`). The created
#     sandbox's id/slug are recorded on the run state, and the interpreter switches the "effective
#     environment" to the new slug so EVERY subsequent step provisions INTO this sandbox (via the
#     `X-Thoryn-Environment` header, SSO-2876/2870). The id/slug are addressable as `{{env.id}}` /
#     `{{env.slug}}`.
#   • applications.create / identity.registerUser → created in the sandbox (no `X-Thoryn-Environment`
#     plumbing needed in the recipe — the interpreter targets the active sandbox automatically).
#   • teardown env.delete → product-api `DELETE /api/v1/environments/{id}` (`tenant:environments.write`).
#     It is SANDBOX-ONLY (the production plane 409s). The `id` here references `{{env.id}}`; the
#     confirmation slug the interpreter sends as `X-Thoryn-Confirm` is the environment's OWN slug,
#     which it resolves from the recorded run state (absent → 428, mismatch → 422). The hard-delete of
#     the sandbox cascades the client too — deleting the client first (child-first) is belt-and-braces.
apiVersion: thoryn.io/examples/v1
id: sandbox-signin
version: 1.2.0
summary: Provision an ephemeral sandbox environment + a loopback OAuth client + a user in it, style its hosted sign-in screen, sign in, then hard-delete both.

requires:
  scopes:
    # env.create / env.delete (write), applications.create (write) + the applications.get verify (read),
    # and identity.registerUser (users.write — provision a sign-in-able user in the sandbox).
    - tenant:environments.write
    - tenant:applications.write
    - tenant:applications.read
    - tenant:users.write
    # tenant.configureLoginTheme — style the sandbox's hosted sign-in screen (SSO-3037).
    - tenant:idp.write
  # The release that carries the `tenant.configureLoginTheme` recipe action (SSO-3037) — on top of the
  # SSO-2968 fetched-catalog + full-entitlement env.create/env.delete + identity.registerUser actions
  # this recipe already needs. The CLI refuses an older build, so the sandbox-e2e (which runs the LATEST
  # released CLI) must be on cli >= 0.5.0.
  minCliVersion: 0.5.0

params:
  - name: workspaceSlug
    prompt: "Standing workspace slug (the workspace your API key is scoped to; NOT created)"
    # No default: this MUST name an existing workspace the caller owns. CI passes it via
    # `--set workspaceSlug=<slug>`; the guided `apply` prompts for it. Used by the interpreter to scope
    # the app/env deletes and to derive the tenant issuer for the receipt.
    validate: "^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])$"
  - name: envSlug
    prompt: "Slug for the fresh ephemeral sandbox environment (a new one is created per run)"
    # {{generate.slug8}} expands to 8 random hex chars so each run's sandbox is uniquely named and
    # never collides with a prior run's leftover.
    default: "sbx-signin-{{generate.slug8}}"
    validate: "^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])$"
  - name: envName
    prompt: "Display name for the ephemeral sandbox environment"
    default: "Sandbox Sign-in"
  - name: appName
    prompt: "Display name for the ephemeral OAuth client"
    default: "Sandbox Sign-in App {{generate.slug8}}"

steps:
  - id: env
    action: env.create
    description: Create a fresh, throwaway SANDBOX environment in the standing workspace; later steps provision into it.
    with:
      slug: "{{envSlug}}"
      name: "{{envName}}"

  - id: app
    action: applications.create
    description: Register a public loopback authorization-code client INSIDE the fresh sandbox environment.
    with:
      displayName: "{{appName}}"
      clientType: public
      grantTypes: ["authorization_code"]
      scopes: ["openid", "profile", "email"]
      redirectUris: ["http://127.0.0.1/callback"]
      # SSO-2897 — OIDC RP-Initiated Logout: a loopback RP posts end_session with a
      # post_logout_redirect_uri on this loopback host (port-agnostic, like redirectUris).
      postLogoutRedirectUris: ["http://127.0.0.1/"]

  - id: theme
    action: tenant.configureLoginTheme
    description: Style the sandbox's hosted sign-in screen (SSO-3037) — a distinct brand color so the branded login is visible (and asserted by the e2e).
    with:
      # A distinctive primary (not the platform default #2563eb) so the branded hosted login is
      # unmistakable and the e2e can assert the `--brand-primary` CSS variable carries this value.
      # Applied to THIS per-run sandbox env only; torn down with it. Server-validated + WCAG-contrast-guarded.
      primaryColor: "#7c3aed"
      backgroundColor: "#ffffff"
      borderRadiusPx: 10
      theme: light

  - id: user
    action: identity.registerUser
    description: Register a verified, sign-in-able user IN the sandbox so `examples run` can sign in end to end (SSO-2908).
    with:
      # Field names match product-api's CreateUserRequest (POST /api/v1/users, tenant:users.write).
      # The email is tied to the fresh per-run ENV slug (each run creates a NEW sandbox, so the account
      # never collides with a prior run) — no randomness primitive needed at the step level.
      email: "{{envSlug}}@example.com"
      # A `password` sets an initial credential so the user can sign in immediately, and
      # `emailVerified: true` marks the account verified so the sign-in leg proceeds WITHOUT an email
      # round-trip. Rotate this before any real use — it is a published example value.
      password: "Example-Signin-Pw1!"
      givenName: "Demo"
      familyName: "User"
      emailVerified: true
      # NOTE(SSO-2969): whether identity.registerUser is per-ENVIRONMENT (created inside this sandbox
      # and only visible/sign-in-able there) or lands at the WORKSPACE scope is UNPROVEN — the
      # interpreter switches the effective environment to the sandbox before this step (so it SHOULD be
      # per-env), but the identity/user surface may not yet honour `X-Thoryn-Environment`. The first
      # LIVE sandbox-e2e run must confirm this user signs in against the sandbox's per-env issuer. Do
      # NOT paper over a per-workspace landing with a non-allowlisted action — if it lands at workspace
      # scope, that is a product gap to record (SSO-2943 family), not a shortcut to invent.

verify:
  - assert: applications.get
    id: "{{app.clientId}}"
    expect:
      status: active

# Teardown runs in declared (child-first) order: delete the app FIRST, then hard-delete the sandbox it
# lives in. env.delete targets the sandbox created above via `{{env.id}}`; the interpreter supplies the
# environment's OWN slug as the X-Thoryn-Confirm confirmation (resolved from the recorded run state), so
# no slug is templated here. env.delete is SANDBOX-ONLY — it refuses the production plane (409). The
# hard-delete cascades the client (and any user provisioned into the sandbox), so the earlier
# applications.delete is belt-and-braces; both are best-effort, so a failed run still cleans up.
teardown:
  - action: applications.delete
    id: "{{app.clientId}}"
  - action: env.delete
    id: "{{env.id}}"

assets:
  # SSO-2880 — `thoryn examples run sandbox-signin` launches this readable, dependency-free loopback
  # relying party (copied verbatim from simple-signin — it is generic; issuer/client come from env).
  rp: ./apps/loopback-rp
  docs: ./README.md
