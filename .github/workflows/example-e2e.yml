name: example-e2e

# SSO-2909 (harness) + SSO-2912 (workflow), epic SSO-2906 — drive the `simple-signin`
# example end-to-end against the STAGING SaaS in a real browser, capturing the REAL
# verification email from an EPHEMERAL, in-job Mailpit sink so a genuine self-service
# sign-up can proceed (Path B). NO k3d, NO self-deployed stack, NO external mail
# service, NO persistent VM: the CLI talks to staging exactly as a customer would, and
# the mail sink lives and dies with this GitHub Actions job.
#
# How the sink works (product-owner decision — fully ephemeral, zero standing cost):
#   • Mailpit runs as a Docker container INSIDE the runner: :1025 = SMTP, :8025 = HTTP API.
#   • A GitHub-hosted runner has NO public inbound, but the tenant's BYO-SMTP (SSO-2917)
#     must reach the sink over PUBLIC SMTP. So we open a public TCP TUNNEL to :1025 for
#     the duration of the run (ngrok by default; `bore.pub` is a no-account fallback —
#     flip SINK_TUNNEL). The tunnel yields a public host:port → the workspace BYO-SMTP.
#     SmtpTargetGuard allows it because the tunnel host is public; staging egress is open.
#   • The harness reads the captured mail over Mailpit's LOCAL API (localhost:8025, no
#     auth) — the tunnel is SMTP-only and never exposes the API.
#   • Everything is torn down when the job ends (container + tunnel die with the runner).
#
# Plaintext-over-tunnel caveat: the ngrok/bore TCP tunnel forwards raw bytes and cannot
# present a valid STARTTLS cert for its ephemeral hostname, so the BYO-SMTP leg uses
# `--transport-security none --allow-insecure`. This is acceptable ONLY because the sink
# is a throwaway TEST mailbox that receives a single verification email per run and holds
# nothing sensitive — never a pattern for a production SMTP provider.
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  SCAFFOLD — NOT YET ACTIVATED. Until the maintainer creates the three secrets │
# │  below (see e2e/README.md) this workflow is workflow_dispatch-only and FAILS  │
# │  at the WIF login step. A FIRST live run must also confirm the seams the      │
# │  harness marks LIVE-CONFIRM (tenant self-service-signup entry, BYO-SMTP→sink   │
# │  delivery over the tunnel, the RP OIDC round-trip). Do NOT treat a green local │
# │  scaffold as a green pipeline.                                                 │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Auth = WIF (SSO-2910, same as conformance.yml): GitHub Actions OIDC → the hub's
# Workload Identity Federation (RFC 8693 token-exchange), private_key_jwt client
# assertion, NO shared client secret. Needs `id-token: write` + THORYN_CI_WIF_SIGNING_KEY.
#
# The journey (orchestrated below):
#   WIF login → `examples apply simple-signin` (fresh workspace + public app + user)
#   → start in-job Mailpit + open a public SMTP tunnel to it → point the workspace
#   BYO-SMTP (SSO-2917) at the tunnel → start the recipe's loopback RP → Playwright
#   Path-B journey (self-service sign-up → capture email from LOCAL Mailpit API →
#   verify → sign in via RP → /protected) → teardown (sink + tunnel + `examples teardown`).

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: "Recipe id to run (only simple-signin is wired for the browser journey today)"
        required: false
        default: simple-signin
  schedule:
    - cron: "41 4 * * *" # nightly, offset from conformance.yml (23 4)

permissions:
  contents: read # checkout
  id-token: write # mint the GitHub Actions OIDC token the WIF login exchanges

concurrency:
  group: example-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  THORYN_HUB: https://hub.stg.thoryn.org
  THORYN_GATEWAY: https://api.stg.thoryn.org
  # identity host that serves the hosted register/login screens + the verify-email
  # landing on staging. Overridden here if the tenant serves them on its own subdomain.
  IDENTITY_BASE_URL: https://identity.stg.thoryn.org
  # The runner is headless with no OS keyring → the CLI's default token store is
  # unavailable and it refuses to silently write plaintext. Sanctioned CI opt-in
  # (same as conformance.yml): the token is short-lived (WIF-minted), runner ephemeral.
  THORYN_CI_PLAINTEXT_TOKENS: "1"
  RP_PORT: "8471"
  # The tenant BYO-SMTP "from" address. Mailpit captures every message regardless of
  # sender; a reserved .test domain keeps it unmistakably non-routable.
  SMTP_FROM_ADDRESS: noreply@example.test
  # Which public TCP tunnel to open to the in-job Mailpit SMTP port. Default `ngrok`
  # (needs the NGROK_AUTHTOKEN secret + a free ngrok account); set the repo variable
  # SINK_TUNNEL=bore for the no-account `bore.pub` fallback (see e2e/README.md).
  SINK_TUNNEL: ${{ vars.SINK_TUNNEL || 'ngrok' }}

jobs:
  example-e2e:
    name: example-e2e (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout thoryn-examples
        uses: actions/checkout@v4

      - name: Set up Java (for the thoryn CLI jar)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js (Playwright harness + loopback RP)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── Fetch the prebuilt thoryn CLI (published by oauthy's cli-release) ────
      - name: Download the prebuilt thoryn CLI (latest cli-v* release)
        env:
          # BLOCKED(SSO-2912): secret OATHY_CLI_TOKEN must exist (already used by
          # conformance.yml) — a token that can read thoryn-io/oauthy releases.
          GH_TOKEN: ${{ secrets.OATHY_CLI_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo thoryn-io/oauthy --limit 40 --json tagName -q '.[].tagName' | grep '^cli-v' | head -1)"
          [ -n "$tag" ] || { echo "::error::no cli-v* release found in thoryn-io/oauthy — run its cli-release workflow first"; exit 1; }
          echo "Using CLI release $tag"
          gh release download "$tag" --repo thoryn-io/oauthy --pattern 'thoryn.jar' --dir .

      # ── Authenticate the CLI via GitHub OIDC → hub WIF (SSO-2910) ────────────
      - name: Sign in (GitHub Actions OIDC → hub Workload Identity Federation)
        env:
          # BLOCKED(SSO-2912): secret THORYN_CI_WIF_SIGNING_KEY must be created — the
          # EC P-256 (ES256) PKCS#8 private key for the conformance-ci-github-wif
          # exchange client (public half seeded on the hub; subject pinned to
          # repo:thoryn-io/thoryn-examples:*). Same secret conformance.yml uses.
          THORYN_CI_WIF_SIGNING_KEY: ${{ secrets.THORYN_CI_WIF_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "${THORYN_CI_WIF_SIGNING_KEY:-}" ] || { echo "::error::THORYN_CI_WIF_SIGNING_KEY is not set"; exit 1; }
          # Proven login form (conformance.yml): --workload-identity defaults
          # tenant=ci-conformance, client=conformance-ci-github-wif, kid, and requests
          # the OIDC audience = --issuer (the hub's allowed_audience).
          java -jar thoryn.jar login --workload-identity --issuer "$THORYN_HUB"

      # ── Provision the example via the real product APIs ─────────────────────
      # ── Start the EPHEMERAL in-job Mailpit sink + open a public SMTP tunnel ──
      # (BEFORE apply, so its address can be passed to the recipe via --set.)
      - name: Start in-job Mailpit + open a public TCP tunnel to its SMTP port
        id: sink
        env:
          # BLOCKED(SSO-2912): secret NGROK_AUTHTOKEN must be created (free ngrok
          # account) — the ONLY new secret this workflow adds. Not needed when
          # SINK_TUNNEL=bore (bore.pub is account-less).
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          set -euo pipefail

          # Per-run SMTP password: generated here, never committed, dies with the runner.
          SMTP_PW="$(openssl rand -hex 16)"
          echo "::add-mask::$SMTP_PW"
          echo "SMTP_PW=$SMTP_PW" >> "$GITHUB_ENV"

          # 1) Mailpit in Docker — :1025 SMTP (tunnelled to the public internet),
          #    :8025 HTTP API (read LOCALLY by the harness). MP_SMTP_AUTH_ALLOW_INSECURE
          #    because the tunnel carries plaintext SMTP (no STARTTLS cert for its host).
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 \
            -e MP_SMTP_AUTH="ci:$SMTP_PW" \
            -e MP_SMTP_AUTH_ALLOW_INSECURE=true \
            axllent/mailpit:latest
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8025/api/v1/info >/dev/null 2>&1 && { echo "Mailpit API is up"; break; }
            sleep 1
          done

          # 2) Public TCP tunnel → Mailpit SMTP (:1025). Default ngrok; bore = no-account
          #    fallback. Swapping between them is this small, documented SINK_TUNNEL toggle.
          public_url=""
          case "$SINK_TUNNEL" in
            ngrok)
              [ -n "${NGROK_AUTHTOKEN:-}" ] || { echo "::error::NGROK_AUTHTOKEN is not set (or set repo variable SINK_TUNNEL=bore)"; exit 1; }
              curl -sSLo /tmp/ngrok.tgz https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
              sudo tar -xzf /tmp/ngrok.tgz -C /usr/local/bin
              ngrok config add-authtoken "$NGROK_AUTHTOKEN"
              ngrok tcp 1025 --log=stdout > /tmp/ngrok.log 2>&1 &
              echo "NGROK_PID=$!" >> "$GITHUB_ENV"
              # ngrok exposes a local admin API at :4040 whose /api/tunnels carries the
              # public tcp://host:port. Poll it until the tunnel is established.
              for _ in $(seq 1 30); do
                public_url="$(curl -fsS http://localhost:4040/api/tunnels 2>/dev/null | grep -oE 'tcp://[0-9a-zA-Z.-]+:[0-9]+' | head -1 || true)"
                [ -n "$public_url" ] && break
                sleep 1
              done
              [ -n "$public_url" ] || { echo "::error::ngrok tunnel did not come up"; echo '--- ngrok.log ---'; cat /tmp/ngrok.log || true; exit 1; }
              ;;
            bore)
              # No-account fallback: bore.pub assigns a random public port that forwards
              # to our local :1025. No token, no config. (github.com/ekzhang/bore)
              curl -sSLo /tmp/bore.tgz https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
              sudo tar -xzf /tmp/bore.tgz -C /usr/local/bin
              bore local 1025 --to bore.pub > /tmp/bore.log 2>&1 &
              echo "BORE_PID=$!" >> "$GITHUB_ENV"
              port=""
              for _ in $(seq 1 30); do
                port="$(grep -oE 'remote_port[=: ]+[0-9]+|bore\.pub:[0-9]+' /tmp/bore.log 2>/dev/null | grep -oE '[0-9]+' | head -1 || true)"
                [ -n "$port" ] && break
                sleep 1
              done
              [ -n "$port" ] || { echo "::error::bore tunnel did not come up"; echo '--- bore.log ---'; cat /tmp/bore.log || true; exit 1; }
              public_url="tcp://bore.pub:${port}"
              ;;
            *)
              echo "::error::unknown SINK_TUNNEL '$SINK_TUNNEL' (expected ngrok|bore)"; exit 1
              ;;
          esac

          host="$(printf '%s' "$public_url" | sed -E 's#^tcp://([^:]+):([0-9]+)$#\1#')"
          port="$(printf '%s' "$public_url" | sed -E 's#^tcp://([^:]+):([0-9]+)$#\2#')"
          [ -n "$host" ] && [ -n "$port" ] || { echo "::error::could not parse tunnel host:port from '$public_url'"; exit 1; }
          {
            echo "smtp_host=$host"
            echo "smtp_port=$port"
          } >> "$GITHUB_OUTPUT"
          echo "Public SMTP sink: ${host}:${port} → in-job Mailpit :1025 (API on localhost:8025)"

      # ── Provision the workspace + app + user, AND configure the new workspace's ──
      # ── BYO-SMTP → the tunnelled sink IN-FLOW via `apply --set` (SSO-2927). ──
      # The recipe's optional configure-email-provider step runs on the workspace's live
      # PROVISIONING TOKEN — the only thing that can reach a just-provisioned workspace in
      # CI (the standalone `workspace email-provider` command needs a per-tenant re-auth
      # the WIF identity can't do: `login --issuer https://{slug}.hub.stg.thoryn.org` → 401).
      - name: Apply the simple-signin example (+ BYO-SMTP → the tunnelled sink)
        id: apply
        env:
          SINK_SMTP_HOST: ${{ steps.sink.outputs.smtp_host }}
          SINK_SMTP_PORT: ${{ steps.sink.outputs.smtp_port }}
        run: |
          set -euo pipefail
          [ -n "${SINK_SMTP_HOST:-}" ] && [ -n "${SINK_SMTP_PORT:-}" ] || { echo "::error::tunnel host/port missing"; exit 1; }
          # transport=none + allow-insecure: the TCP tunnel can't present a valid STARTTLS
          # cert for its ephemeral hostname — plaintext to a throwaway TEST sink only. The
          # per-run SMTP password (ephemeral, masked, dies with the runner) is passed via
          # --set; MP_SMTP_AUTH=ci:$SMTP_PW means only this run can deliver to the sink.
          java -jar thoryn.jar examples apply simple-signin --yes \
            --hub "$THORYN_HUB" --gateway "$THORYN_GATEWAY" \
            --set smtpHost="$SINK_SMTP_HOST" \
            --set smtpPort="$SINK_SMTP_PORT" \
            --set smtpUsername=ci \
            --set smtpPassword="$SMTP_PW" \
            --set smtpTransport=none \
            --set smtpAllowInsecure=true \
            --set smtpFromAddress="$SMTP_FROM_ADDRESS" | tee /tmp/apply.out
          # Parse slug + clientId from the result lines (workspace: slug=… / client: clientId=…)
          # and CONSTRUCT the tenant issuer from the slug (the CLI prints no issuer URL).
          slug="$(grep -oE 'slug=[a-z0-9][a-z0-9-]*' /tmp/apply.out | head -1 | cut -d= -f2)"
          client="$(grep -oE 'clientId=app-[A-Za-z0-9-]+' /tmp/apply.out | head -1 | cut -d= -f2)"
          issuer="https://${slug}.hub.stg.thoryn.org"
          [ -n "$slug" ] && [ -n "$client" ] || { echo "::error::could not parse slug/clientId from apply output"; sed -n '1,80p' /tmp/apply.out; exit 1; }
          {
            echo "issuer=$issuer"
            echo "client_id=$client"
            echo "slug=$slug"
          } >> "$GITHUB_OUTPUT"
          echo "Provisioned workspace '$slug' (issuer=$issuer, client=$client) with BYO-SMTP → sink"

      # ── Start the loopback RP (the app the end user signs in to) ─────────────
      - name: Start the loopback relying-party
        env:
          THORYN_ISSUER: ${{ steps.apply.outputs.issuer }}
          THORYN_CLIENT_ID: ${{ steps.apply.outputs.client_id }}
          PORT: ${{ env.RP_PORT }}
        run: |
          node recipes/simple-signin/apps/loopback-rp/server.js &
          echo "RP_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${RP_PORT}/" >/dev/null 2>&1 && { echo "RP is up"; break; }
            sleep 1
          done

      # ── Drive the Path-B browser journey (SSO-2909) ─────────────────────────
      - name: Run the Playwright harness (Path B — Mailpit email capture)
        env:
          THORYN_ISSUER: ${{ steps.apply.outputs.issuer }}
          THORYN_CLIENT_ID: ${{ steps.apply.outputs.client_id }}
          RP_BASE_URL: http://127.0.0.1:${{ env.RP_PORT }}
          IDENTITY_BASE_URL: ${{ env.IDENTITY_BASE_URL }}
          # The harness reads the captured mail from the in-job Mailpit's LOCAL API —
          # no tunnel, no auth. (config.ts already defaults to this; set explicitly.)
          MAILPIT_BASE_URL: http://localhost:8025
          CI: "true"
        working-directory: e2e
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-e2e-playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

      # ── Teardown — always, even on failure ───────────────────────────────────
      # The container + tunnel would die with the runner regardless; killing them
      # explicitly is tidy. `examples teardown` hard-deletes the workspace.
      - name: Teardown the sink, tunnel, RP, and example
        if: always()
        run: |
          [ -n "${RP_PID:-}" ] && kill "$RP_PID" 2>/dev/null || true
          [ -n "${NGROK_PID:-}" ] && kill "$NGROK_PID" 2>/dev/null || true
          [ -n "${BORE_PID:-}" ] && kill "$BORE_PID" 2>/dev/null || true
          docker rm -f mailpit 2>/dev/null || true
          java -jar thoryn.jar examples teardown simple-signin \
            --hub "$THORYN_HUB" --gateway "$THORYN_GATEWAY" || true
