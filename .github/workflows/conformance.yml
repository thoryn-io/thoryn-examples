name: conformance

# SSO-2877 / SSO-2879 — run every recipe apply → verify → teardown against STAGING with the real
# thoryn CLI, so a recipe that has drifted from the product (or a product change that breaks a recipe)
# fails here. This is the self-maintaining half of the catalog: a red recipe blocks a release.
#
# Runs nightly and on demand. Authenticated SECRET-LESS via GitHub Actions OIDC → the hub's Workload
# Identity Federation (RFC 8693 token-exchange): the runner's short-lived OIDC token is exchanged for a
# hub access token, and the exchange client authenticates with an asymmetric key (private_key_jwt). No
# shared client secret is stored. See ADR oathy adrs/2026-09-06-conformance-ci-github-oidc-wif.md.
#
# Required repo secrets (provision once):
#   THORYN_CI_WIF_SIGNING_KEY — the EC P-256 (ES256) PRIVATE key for the exchange client
#                               `conformance-ci-github-wif`. The PUBLIC half is registered on the hub
#                               inline in migration V143 (kid=ci-conformance-wif-v1) — nothing to host.
#   OATHY_CLI_TOKEN           — a token (PAT / GitHub App) that can read thoryn-io/oauthy RELEASES, to
#                               download the prebuilt thoryn CLI jar (published by oauthy's cli-release
#                               workflow on a `cli-v*` tag).
#
# The hub trust (tenant `ci-conformance`, client `conformance-ci-github-wif`, issuer
# token.actions.githubusercontent.com, audience = the hub issuer below, subject pinned to
# ^repo:thoryn-io/thoryn-examples:.*$) is seeded in hub V143 — the CLI defaults already match it, so
# the login line needs no client-id / tenant / kid flags. Staging hosts are the known constants below.

on:
  schedule:
    - cron: "23 4 * * *" # nightly
  workflow_dispatch:
    inputs:
      recipe:
        description: "Only run this recipe id (default: all)"
        required: false

permissions:
  contents: read # checkout
  id-token: write # mint the GitHub Actions OIDC token the WIF login exchanges

env:
  THORYN_HUB: https://hub.stg.thoryn.org
  THORYN_GATEWAY: https://api.stg.thoryn.org
  # The runner is headless with no OS keyring, so the CLI's default token store is unavailable and
  # (per ADR 2026-04-25 §4) it refuses to silently write plaintext. This is the sanctioned CI opt-in:
  # the token is short-lived (WIF-minted) and the runner is ephemeral and destroyed after the job.
  THORYN_CI_PLAINTEXT_TOKENS: "1"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download the prebuilt thoryn CLI (latest cli-v* release)
        env:
          GH_TOKEN: ${{ secrets.OATHY_CLI_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo thoryn-io/oauthy --limit 40 --json tagName -q '.[].tagName' | grep '^cli-v' | head -1)"
          [ -n "$tag" ] || { echo "::error::no cli-v* release found in thoryn-io/oauthy — run its cli-release workflow first"; exit 1; }
          echo "Using CLI release $tag"
          gh release download "$tag" --repo thoryn-io/oauthy --pattern 'thoryn.jar' --dir .

      - name: Sign in (GitHub Actions OIDC → hub Workload Identity Federation)
        env:
          # The CLI reads the runner's OIDC token from ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN (present
          # because id-token: write above) and signs the private_key_jwt client assertion with this key.
          THORYN_CI_WIF_SIGNING_KEY: ${{ secrets.THORYN_CI_WIF_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "${THORYN_CI_WIF_SIGNING_KEY:-}" ] || { echo "::error::THORYN_CI_WIF_SIGNING_KEY is not set"; exit 1; }
          # --workload-identity defaults tenant=ci-conformance, client=conformance-ci-github-wif,
          # kid=ci-conformance-wif-v1, and requests the OIDC audience = --issuer (the hub's allowed_audience).
          java -jar thoryn.jar login --workload-identity --issuer "$THORYN_HUB"

      - name: Recipe conformance — apply → verify → teardown
        run: |
          set -uo pipefail
          CLI="java -jar thoryn.jar"
          only='${{ github.event.inputs.recipe }}'
          fail=0
          for d in recipes/*/; do
            id="$(basename "$d")"
            if [ -n "$only" ] && [ "$only" != "$id" ]; then continue; fi
            echo "::group::$id"
            ok=1
            $CLI examples apply "$id" --yes --hub "$THORYN_HUB" --gateway "$THORYN_GATEWAY" || ok=0
            if [ "$ok" = 1 ]; then $CLI examples verify "$id" --hub "$THORYN_HUB" --gateway "$THORYN_GATEWAY" || ok=0; fi
            # Always attempt teardown so a failed run doesn't leave residue.
            $CLI examples teardown "$id" --hub "$THORYN_HUB" --gateway "$THORYN_GATEWAY" || true
            if [ "$ok" = 0 ]; then echo "::error::recipe '$id' failed conformance"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail
