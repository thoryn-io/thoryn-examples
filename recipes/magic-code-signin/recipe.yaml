# SSO-2595 (epic SSO-3042) — `magic-code-signin`: PASSWORDLESS sign-in with a 6-digit email OTP.
# Same per-run ephemeral sandbox as sandbox-signin (env + a loopback OAuth client + a sign-in-able
# user), but the browser journey signs in with NO password: it requests a single-use 6-digit code,
# captures that email from the sandbox test-inbox (SSO-3074), types the code back on the hosted login,
# and the OAuth flow resumes to the RP.
#
# Why the recipe is just env + app + user: magic-code is OPT-IN (NOT in the default method set), so the
# e2e journey ENABLES it for the sandbox with `thoryn login-methods set --environment <slug>
# --method password --method magic_link --method magic_code` (SSO-3075) before signing in — a
# supported CLI action, not a raw API call. Enforcement is per-environment (SSO-3073), so the sandbox
# login page offers magic-code without touching production. Provisioning stays env + app + user.
#
# HOW THE INTERPRETER WIRES IT (thoryn-cli RecipeInterpreter): env.create → POST /api/v1/environments;
# the interpreter targets later steps at the sandbox; applications.create + identity.registerUser land
# in it; teardown env.delete hard-deletes the sandbox (cascading the client + user).
#
# SSO-3091/3092 (epic SSO-3087): the recipe is now ONLY the example configuration a customer applies —
# the loopback OAuth client — targeted at the environment the guided `examples apply` resolves (a
# sandbox by default, SSO-2876) or the one `--environment` names. The throwaway sandbox and the
# sign-in-able user the browser scenario needs are FIXTURES in `e2e/provision.yaml` (converged by
# `thoryn provision apply`); the previous env.create / identity.registerUser (with a published
# password) / env.delete steps are gone. The passwordless 6-digit email code behaviour itself is exercised by the journey
# and the recipe's relying party — it needs no extra tenant configuration from the recipe.
apiVersion: thoryn.io/examples/v1
id: magic-code-signin
version: 2.0.0
summary: Register a public loopback OAuth client in an environment you own, enable magic-code for the sandbox, then sign in PASSWORDLESS by typing a single-use 6-digit email code.

requires:
  scopes:
    - tenant:applications.write
    - tenant:applications.read
  minCliVersion: 0.3.7

params:
  - name: workspaceSlug
    prompt: "Standing workspace slug (the workspace your API key is scoped to; NOT created)"
    validate: "^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])$"
  - name: appName
    prompt: "Display name for the OAuth client"
    default: "Magic-code Sign-in App {{generate.slug8}}"

steps:
  - id: app
    action: applications.create
    description: Register a public loopback authorization-code client in the selected environment.
    with:
      displayName: "{{appName}}"
      clientType: public
      grantTypes: ["authorization_code"]
      scopes: ["openid", "profile", "email"]
      redirectUris: ["http://127.0.0.1/callback"]
      postLogoutRedirectUris: ["http://127.0.0.1/"]

verify:
  - assert: applications.get
    id: "{{app.clientId}}"
    expect:
      status: active

teardown:
  - action: applications.delete
    id: "{{app.clientId}}"

assets:
  rp: ./apps/loopback-rp
  docs: ./README.md
