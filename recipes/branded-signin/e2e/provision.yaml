# SSO-3091 (epic SSO-3087) — the FIXTURES of the `branded-signin` browser scenario: test scaffolding,
# NOT the example (`../recipe.yaml` is what a customer applies). One throwaway sandbox per run
# (`{{env.E2E_ENV_SLUG}}`, exported by the workflow); the recipe's client + theme are applied INTO it,
# the journey registers its own end user on the (branded) hosted screens and reads the verification
# email from the sandbox test-inbox. Converged by the thoryn-cli provision Action at the start of
# `.github/workflows/branded-signin-e2e.yml`; removed by `thoryn provision destroy` in the workflow's
# own `if: always()` step after the journey (the hard-delete cascades client, theme and users).
apiVersion: thoryn.io/provision/v1
resources:
  - kind: environment
    name: sandbox
    spec:
      slug: "{{env.E2E_ENV_SLUG}}"
      displayName: "branded-signin e2e"
