# SSO-3037/3039 — `branded-signin`: the hosted sign-in screen STYLED for your brand (logo/colors/
# radius/theme + allowlisted CSS variables), proven end to end through a loopback relying party.
# SSO-3091/3092 (epic SSO-3087): the recipe is now ONLY the example configuration a customer applies —
# the client and the login theme — targeted at the environment the guided `examples apply` resolves
# (a sandbox by default, SSO-2876) or the one `--environment` names. The throwaway sandbox the browser
# scenario needs is a FIXTURE in `e2e/provision.yaml`; the journey's end user is registered through
# the hosted self-service screens (no pre-registered user with a published password).
#
# HOW THE INTERPRETER WIRES IT (thoryn-cli RecipeInterpreter): applications.create + the branding PUT
# land in the selected environment (`--environment <slug>` → X-Thoryn-Environment); teardown deletes
# the client (the theme is environment config and stays with the environment).
apiVersion: thoryn.io/examples/v1
id: branded-signin
version: 2.0.0
summary: Register a public loopback OAuth client and style the hosted sign-in screen (brand color, radius, theme, CSS variables) in an environment you own, then sign in through the recipe's relying party.

requires:
  scopes:
    - tenant:applications.write
    - tenant:applications.read
    - tenant:idp.write
  # tenant.configureLoginTheme + cssVariables (SSO-3037/3038).
  minCliVersion: 0.6.0

params:
  - name: workspaceSlug
    prompt: "Standing workspace slug (the workspace your API key is scoped to; NOT created)"
    validate: "^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])$"
  - name: appName
    prompt: "Display name for the OAuth client"
    default: "Branded Sign-in App {{generate.slug8}}"
  - name: primaryColor
    prompt: "Primary/brand color for the hosted sign-in screen (CSS hex)"
    default: "#7c3aed"
    validate: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$"
  - name: loginTheme
    prompt: "Color theme: light | dark | auto"
    default: "light"
    validate: "^(light|dark|auto)$"

steps:
  - id: app
    action: applications.create
    description: Register a public loopback authorization-code client in the selected environment.
    with:
      displayName: "{{appName}}"
      clientType: public
      grantTypes: ["authorization_code"]
      scopes: ["openid", "profile", "email"]
      redirectUris: ["http://127.0.0.1/callback"]
      postLogoutRedirectUris: ["http://127.0.0.1/"]

  - id: theme
    action: tenant.configureLoginTheme
    description: Style the environment's hosted sign-in screen — brand color, radius, theme, CSS variables (SSO-3037/3038).
    with:
      primaryColor: "{{primaryColor}}"
      backgroundColor: "#ffffff"
      borderRadiusPx: 10
      theme: "{{loginTheme}}"
      cssVariables:
        "--thoryn-accent": "#0369a1"
        "--thoryn-font-family": "Georgia, serif"

verify:
  - assert: applications.get
    id: "{{app.clientId}}"
    expect:
      status: active

teardown:
  - action: applications.delete
    id: "{{app.clientId}}"

assets:
  rp: ./apps/loopback-rp
  docs: ./README.md
