# SSO-3043 (epic SSO-3042) — `totp-signin`: the canonical TWO-FACTOR example. Same per-run ephemeral
# sandbox as sandbox-signin (env + a loopback OAuth client + a sign-in-able user), but the browser
# journey ENROLS a TOTP authenticator and proves a fresh sign-in is then challenged for a second
# factor — the real MFA challenge chain, end to end.
#
# Why the recipe is just env + app + user (no MFA-specific action): MFA in Thoryn is USER-enrolment-
# driven — once a user enrols a second factor, every sign-in challenges for it, independent of the
# app. So the recipe provisions the same shape as sandbox-signin; the TOTP enrolment + challenge live
# entirely in the e2e journey (it enrols via the self-service /api/v1/me/mfa/totp/enrol API as the
# signed-in user, computes the code with e2e/lib/totp.mjs, then answers the hosted /mfa/totp/challenge
# on a fresh sign-in). No new allowlisted action and no new scope are needed.
#
# HOW THE INTERPRETER WIRES IT (thoryn-cli RecipeInterpreter): env.create → POST /api/v1/environments;
# the interpreter targets later steps at the sandbox; applications.create + identity.registerUser land
# in it; teardown env.delete hard-deletes the sandbox (cascading the client + user).
apiVersion: thoryn.io/examples/v1
id: totp-signin
version: 1.0.0
summary: Provision an ephemeral sandbox + a loopback OAuth client + a user, enrol a TOTP authenticator, and prove the second-factor challenge on sign-in; then hard-delete the sandbox.

requires:
  scopes:
    # env.create / env.delete (write), applications.create (write) + the applications.get verify (read),
    # identity.registerUser (users.write). No MFA-specific scope — TOTP enrolment is a user self-service
    # action the browser journey performs as the signed-in user, not a provisioning call.
    - tenant:environments.write
    - tenant:applications.write
    - tenant:applications.read
    - tenant:users.write
  # Same baseline as sandbox-signin — fetched-catalog + env.create/env.delete + identity.registerUser.
  # No MFA-specific recipe action, so no newer CLI is required.
  minCliVersion: 0.3.7

params:
  - name: workspaceSlug
    prompt: "Standing workspace slug (the workspace your API key is scoped to; NOT created)"
    validate: "^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])$"
  - name: envSlug
    prompt: "Slug for the fresh ephemeral sandbox environment (a new one is created per run)"
    default: "totp-signin-{{generate.slug8}}"
    validate: "^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])$"
  - name: envName
    prompt: "Display name for the ephemeral sandbox environment"
    default: "TOTP Sign-in"
  - name: appName
    prompt: "Display name for the ephemeral OAuth client"
    default: "TOTP Sign-in App {{generate.slug8}}"

steps:
  - id: env
    action: env.create
    description: Create a fresh, throwaway SANDBOX environment in the standing workspace; later steps provision into it.
    with:
      slug: "{{envSlug}}"
      name: "{{envName}}"

  - id: app
    action: applications.create
    description: Register a public loopback authorization-code client INSIDE the fresh sandbox environment.
    with:
      displayName: "{{appName}}"
      clientType: public
      grantTypes: ["authorization_code"]
      scopes: ["openid", "profile", "email"]
      redirectUris: ["http://127.0.0.1/callback"]
      postLogoutRedirectUris: ["http://127.0.0.1/"]

  - id: user
    action: identity.registerUser
    description: Register a verified, sign-in-able user IN the sandbox; the journey enrols TOTP for this user.
    with:
      email: "{{envSlug}}@example.com"
      # A published example credential — rotate before any real use.
      password: "Example-Signin-Pw1!"
      givenName: "Demo"
      familyName: "User"
      emailVerified: true

verify:
  - assert: applications.get
    id: "{{app.clientId}}"
    expect:
      status: active

# Teardown (child-first): delete the app, then hard-delete the sandbox it lives in. The hard-delete
# cascades the client + the user (+ its MFA enrolment) — nothing outlives the environment.
teardown:
  - action: applications.delete
    id: "{{app.clientId}}"
  - action: env.delete
    id: "{{env.id}}"
