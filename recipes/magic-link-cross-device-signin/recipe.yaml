# magic-link-cross-device-signin — how to get the example configured: the extra steps beyond the provisioning.
# SSO-3092 (epic SSO-3087): `provision: ./provision.yaml` gets Thoryn up and running for this example
# (the sandbox, the loopback client, the demo user, the sign-in methods); `thoryn examples apply`
# converges it FIRST — the params below feed its placeholders — then runs whatever is listed here (this
# example needs no extra steps; `run` starts the relying party in ./apps/loopback-rp). Teardown destroys the
# provisioning (child-first; the sandbox hard-delete cascades).
apiVersion: thoryn.io/examples/v1
id: magic-link-cross-device-signin
version: 3.0.0
summary: Register a public loopback OAuth client in an environment you own, then sign in PASSWORDLESS ACROSS TWO DEVICES — open the link on another device, redeem its continuation code on the initiating device.
provision: ./provision.yaml

requires:
  scopes:
    - tenant:environments.write
    - tenant:environments.read
    - tenant:applications.write
    - tenant:applications.read
    - tenant:users.write
    - tenant:users.read
    - tenant:idp.write
    - tenant:idp.read
  # `provision:` on a recipe (SSO-3100).
  minCliVersion: 0.12.0

params:
  - name: workspaceSlug
    prompt: "Standing workspace slug (the workspace your session is bound to; NOT created)"
    validate: "^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])$"
  - name: envSlug
    prompt: "Slug for the throwaway sandbox environment the provision file creates (fresh per run)"
    default: "magic-xdev-{{generate.slug8}}"
    validate: "^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])$"
  - name: appName
    prompt: "Display name for the OAuth client"
    default: "Magic-link Cross-device App {{generate.slug8}}"
  - name: DEMO_USER_PASSWORD
    prompt: "Password for the demo user (feeds the provision file's passwordEnv; never stored)"
    default: "Example-{{generate.slug8}}-Pw1!"
    secret: true

verify:
  - assert: applications.get
    id: "{{provision.application.rp.clientId}}"
    expect:
      status: active

assets:
  rp: ./apps/loopback-rp
  docs: ./README.md
