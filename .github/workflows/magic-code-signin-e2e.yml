name: magic-code-signin-e2e

# SSO-3092 (epic SSO-3087) — the `magic-code-signin` browser scenario on the RECIPE-ORCHESTRATES-PROVISION shape:
#
#   thoryn login --connection      sign in from .thoryn/connection.json (who I am)
#   → thoryn examples apply magic-code-signin   converges recipes/magic-code-signin/provision.yaml FIRST (how to get Thoryn up and
#                                   running for this example: the fixture sandbox `ci-magic-code-signin` (ADOPTED, never created), the loopback client, the demo
#                                   user, the sign-in methods) — the recipe's params feed its placeholders —
#                                   then the recipe's extra steps (none for this example)
#   → Playwright journey            the browser walk through the real hosted screens + the recipe's RP
#   → thoryn examples teardown      destroys what the recipe CREATED inside the fixture (child-first; the adopted sandbox stays)
#
# Real product APIs only, as a real customer: the same recipe + provision file a customer fetches from the
# signed catalog is what CI applies. The ONLY injected secret is THORYN_EXAMPLES_CONFINED_CI_CLIENT_SECRET (the env
# var the contract names). Needs a cli-v* release carrying `provision:` on recipes (SSO-3100).
#
# SSO-3113 (epic SSO-3108) — CI signs in as the least-privilege identity `examples-ci` (.thoryn/connection.json),
# which is `manager` of the long-lived fixture sandbox `ci-magic-code-signin` and of nothing else. A confined identity
# structurally cannot create an environment (that needs `manager` on the WORKSPACE), so the sandbox is
# founder-provisioned once (.thoryn/provision.yaml) and this run ADOPTS it by slug; only what lives inside it
# (the loopback client, the demo user, per-env sign-in config) is created here and destroyed on exit.

on:
  workflow_dispatch:
  schedule:
    - cron: "35 6 * * *" # nightly, staggered — the scenario workflows share the example-e2e concurrency group (one pending run)

permissions:
  contents: write # commit the regenerated E2E_RESULTS.md back (default branch only)

concurrency:
  group: example-e2e
  cancel-in-progress: false

env:
  # SSO-3296 (epic SSO-3289) — the public auth host moves `{slug}.hub.<domain>` -> `{slug}.auth.<domain>`
  # (ADR 2026-09-22-public-issuer-host-auth-subdomain). Every host below is derived from ONE repo
  # variable, so the SSO-3297 staging cutover is a single flip and no workflow file changes:
  #     gh variable set THORYN_TENANT_HOST_LABEL --body auth
  # Unset (today) it defaults to `hub`, which is what staging still serves — so nothing here moves
  # until the product owner flips it.
  THORYN_TENANT_HOST_LABEL: ${{ vars.THORYN_TENANT_HOST_LABEL || 'hub' }}
  THORYN_PLATFORM_APEX: stg.thoryn.org
  # `THORYN_ISSUER` is the documented name (SSO-3296); `THORYN_HUB` is kept because the CURRENTLY
  # RELEASED CLI jar this workflow downloads only reads the old spelling. Drop it after a cli-v*
  # release carrying thoryn-cli#79.
  THORYN_ISSUER: https://${{ vars.THORYN_TENANT_HOST_LABEL || 'hub' }}.stg.thoryn.org
  THORYN_HUB: https://${{ vars.THORYN_TENANT_HOST_LABEL || 'hub' }}.stg.thoryn.org
  THORYN_GATEWAY: https://api.stg.thoryn.org
  RECIPE: magic-code-signin
  THORYN_CI_PLAINTEXT_TOKENS: "1"
  RP_PORT: "8471"

jobs:
  magic-code-signin-e2e:
    name: magic-code-signin-e2e (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout thoryn-examples
        uses: actions/checkout@v4

      - name: Set up Java (for the thoryn CLI jar)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js (Playwright harness + loopback RP)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download the released thoryn CLI (latest cli-v*)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo thoryn-io/thoryn-cli --limit 40 --json tagName -q '.[].tagName' | grep '^cli-v' | head -1)"
          [ -n "$tag" ] || { echo "::error::no cli-v* release found in thoryn-io/thoryn-cli"; exit 1; }
          gh release download "$tag" --repo thoryn-io/thoryn-cli --pattern 'thoryn.jar' --dir .
          echo "Using CLI release $tag"

      # The sandbox is the recipe's LONG-LIVED fixture (`ci-<recipe>`, SSO-3113), never a per-run slug: the recipe's
      # `environment` resource matches it by slug and `examples apply` adopts it. The demo user's password rides
      # ONLY as the env var the provision file names (passwordEnv: DEMO_USER_PASSWORD) — never on argv, never in
      # a receipt — and the SAME value is handed to Playwright as SIGNUP_PASSWORD.
      - name: Bind this run to the recipe's fixture sandbox
        run: |
          set -euo pipefail
          echo "E2E_ENV_SLUG=ci-${RECIPE}" >> "$GITHUB_ENV"
          pw="Ex-$(openssl rand -hex 12)!"
          echo "::add-mask::$pw"
          echo "DEMO_USER_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Sign in (connection contract)
        env:
          THORYN_EXAMPLES_CONFINED_CI_CLIENT_SECRET: ${{ secrets.THORYN_EXAMPLES_CONFINED_CI_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          [ -n "${THORYN_EXAMPLES_CONFINED_CI_CLIENT_SECRET:-}" ] || { echo "::error::THORYN_EXAMPLES_CONFINED_CI_CLIENT_SECRET is not set — the founder apply of .thoryn/provision.yaml mints examples-ci and delivers it (see .thoryn/README.md)"; exit 1; }
          java -jar thoryn.jar login --connection .thoryn/connection.json
          java -jar thoryn.jar login --status

      - name: Update the signed recipe catalog
        run: |
          set -euo pipefail
          java -jar thoryn.jar examples update

      # examples apply converges recipes/magic-code-signin/provision.yaml first (adopts the fixture sandbox, then creates the client + demo user + sign-in methods),
      # then the recipe's extra steps. The receipt lists the provisioned resources.
      - name: Apply the magic-code-signin recipe (provisions first) and resolve issuer/client
        id: apply
        run: |
          set -euo pipefail
          slug="$(jq -r '.workspace.slug' .thoryn/connection.json)"
          java -jar thoryn.jar examples apply "$RECIPE" \
            --set "workspaceSlug=${slug}" --set "envSlug=${E2E_ENV_SLUG}" --yes
          java -jar thoryn.jar examples receipt "$RECIPE" --output json > /tmp/receipt.json
          client="$(jq -r '[.resources[]? | select(.kind=="application") | .id] | first // ""' /tmp/receipt.json)"
          [ -n "$client" ] || { echo "::error::could not parse the clientId from the recipe receipt"; cat /tmp/receipt.json; exit 1; }
          # Per-env issuer = workspace issuer + /{env-slug} PATH (SecurityConfig, SSO-2411). SSO-3296 —
          # the host LABEL comes from THORYN_TENANT_HOST_LABEL, never hard-coded; the `/{env}` path form
          # is unchanged by the host rename (ADR §3).
          workspace_issuer="https://${slug}.${THORYN_TENANT_HOST_LABEL}.${THORYN_PLATFORM_APEX}"
          issuer="${workspace_issuer}/${E2E_ENV_SLUG}"
          # The hosted sign-in screens: a SEPARATE host pre-cutover, same-origin under `/id` after it
          # (ADR §2 — identity mounts on the workspace host at its `/id` context path).
          if [ "$THORYN_TENANT_HOST_LABEL" = "hub" ]; then
            identity_base_url="https://identity.${THORYN_PLATFORM_APEX}"
          else
            identity_base_url="${workspace_issuer}/id"
          fi
          {
            echo "issuer=$issuer"
            echo "workspace_issuer=$workspace_issuer"
            echo "identity_base_url=$identity_base_url"
            echo "client_id=$client"
            echo "workspace_slug=$slug"
          } >> "$GITHUB_OUTPUT"
          echo "Applied '$RECIPE' → client '$client' in sandbox '$E2E_ENV_SLUG' of '$slug' (issuer=$issuer)"

      - name: Start the loopback relying-party
        env:
          THORYN_ISSUER: ${{ steps.apply.outputs.issuer }}
          THORYN_CLIENT_ID: ${{ steps.apply.outputs.client_id }}
          PORT: ${{ env.RP_PORT }}
        run: |
          node recipes/magic-code-signin/apps/loopback-rp/server.js &
          echo "RP_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${RP_PORT}/" >/dev/null 2>&1 && { echo "RP is up"; break; }
            sleep 1
          done

      - name: Run the Playwright harness
        env:
          THORYN_ISSUER: ${{ steps.apply.outputs.issuer }}
          THORYN_CLIENT_ID: ${{ steps.apply.outputs.client_id }}
          RP_BASE_URL: http://127.0.0.1:${{ env.RP_PORT }}
          IDENTITY_BASE_URL: ${{ steps.apply.outputs.identity_base_url }}
          THORYN_JAR: ${{ github.workspace }}/thoryn.jar
          SANDBOX_ENV_SLUG: ${{ env.E2E_ENV_SLUG }}
          SIGNUP_PASSWORD: ${{ env.DEMO_USER_PASSWORD }}
          CI: "true"
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run test:magic-code

      - name: Upload Playwright report + generated E2E_RESULTS.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magic-code-e2e-playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            recipes/magic-code-signin/E2E_RESULTS.md
          if-no-files-found: warn
          retention-days: 14

      - name: Commit back the generated E2E_RESULTS.md
        if: always() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          FILE=recipes/magic-code-signin/E2E_RESULTS.md
          if git diff --quiet -- "$FILE"; then
            echo "E2E_RESULTS.md unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "thoryn-ci[bot]"
          git config user.email "ci@thoryn.io"
          git add "$FILE"
          git commit -m "chore(e2e): update magic-code-signin E2E_RESULTS.md from CI run ${{ github.run_id }} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # examples teardown destroys what the recipe CREATED inside the fixture (child-first: the loopback client, the demo
      # user, …). The sandbox itself was adopted, and adopted resources are never deleted — the fixture outlives the run.
      - name: Teardown (examples teardown)
        if: always()
        run: |
          set -uo pipefail
          [ -n "${RP_PID:-}" ] && kill "$RP_PID" 2>/dev/null || true
          [ -f thoryn.jar ] || { echo "no CLI jar — nothing was provisioned"; exit 0; }
          java -jar thoryn.jar examples teardown "$RECIPE" || echo "::warning::examples teardown reported an error — check for a leaked client/user inside fixture sandbox $E2E_ENV_SLUG (run $GITHUB_RUN_ID)"
