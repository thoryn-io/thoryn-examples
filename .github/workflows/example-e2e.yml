name: example-e2e

# SSO-3092 (epic SSO-3087) — the `simple-signin` browser scenario on the RECIPE-ORCHESTRATES-PROVISION shape:
#
#   thoryn login --connection      sign in from .thoryn/connection.json (who I am)
#   → thoryn examples apply simple-signin   converges recipes/simple-signin/provision.yaml FIRST (how to get Thoryn up and
#                                   running for this example: the loopback client, the demo
#                                   user) — the recipe's params feed its placeholders —
#                                   then the recipe's extra steps (none for this example)
#   → Playwright journey            the browser walk through the real hosted screens + the recipe's RP
#   → thoryn examples teardown      destroys the provisioning (child-first)
#
# Real product APIs only, as a real customer: the same recipe + provision file a customer fetches from the
# signed catalog is what CI applies. The ONLY injected secret is THORYN_EXAMPLES_CI_CLIENT_SECRET (the env
# var the contract names) plus the tunnel provider's token. Needs a cli-v* release carrying `provision:` on recipes (SSO-3100).

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *" # nightly, staggered — the scenario workflows share the example-e2e concurrency group (one pending run)

permissions:
  contents: write # commit the regenerated E2E_RESULTS.md back (default branch only)

concurrency:
  group: example-e2e
  cancel-in-progress: false

env:
  THORYN_HUB: https://hub.stg.thoryn.org
  THORYN_GATEWAY: https://api.stg.thoryn.org
  IDENTITY_BASE_URL: https://identity.stg.thoryn.org
  RECIPE: simple-signin
  THORYN_CI_PLAINTEXT_TOKENS: "1"
  RP_PORT: "8471"
  SMTP_FROM_ADDRESS: noreply@example.test
  SINK_TUNNEL: ${{ vars.SINK_TUNNEL || 'ngrok' }}

jobs:
  example-e2e:
    name: example-e2e (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout thoryn-examples
        uses: actions/checkout@v4

      - name: Set up Java (for the thoryn CLI jar)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js (Playwright harness + loopback RP)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download the released thoryn CLI (latest cli-v*)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo thoryn-io/thoryn-cli --limit 40 --json tagName -q '.[].tagName' | grep '^cli-v' | head -1)"
          [ -n "$tag" ] || { echo "::error::no cli-v* release found in thoryn-io/thoryn-cli"; exit 1; }
          gh release download "$tag" --repo thoryn-io/thoryn-cli --pattern 'thoryn.jar' --dir .
          echo "Using CLI release $tag"

      # Per-run values the recipe's params / the provision file's placeholders consume. The demo user's
      # password rides ONLY as the env var the provision file names (passwordEnv: DEMO_USER_PASSWORD) —
      # never on argv, never in a receipt — and the SAME value is handed to Playwright as SIGNUP_PASSWORD.
      - name: Name this run
        run: |
          set -euo pipefail
          echo "DEMO_EMAIL=demo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com" >> "$GITHUB_ENV"
          pw="Ex-$(openssl rand -hex 12)!"
          echo "::add-mask::$pw"
          echo "DEMO_USER_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Sign in (connection contract)
        env:
          THORYN_EXAMPLES_CI_CLIENT_SECRET: ${{ secrets.THORYN_EXAMPLES_CI_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          [ -n "${THORYN_EXAMPLES_CI_CLIENT_SECRET:-}" ] || { echo "::error::THORYN_EXAMPLES_CI_CLIENT_SECRET is not set (see .thoryn/README.md)"; exit 1; }
          java -jar thoryn.jar login --connection .thoryn/connection.json
          java -jar thoryn.jar login --status

      - name: Start in-job Mailpit + open a public TCP tunnel to its SMTP port
        id: sink
        env:
          # secret NGROK_AUTHTOKEN — free ngrok account; the ONLY tunnel secret. Not needed when
          # SINK_TUNNEL=bore (bore.pub is account-less).
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          set -euo pipefail

          # Per-run SMTP password: generated here, never committed, dies with the runner.
          SMTP_PW="$(openssl rand -hex 16)"
          echo "::add-mask::$SMTP_PW"
          echo "SMTP_PW=$SMTP_PW" >> "$GITHUB_ENV"

          # 1) Mailpit in Docker — :1025 SMTP (tunnelled to the public internet),
          #    :8025 HTTP API (read LOCALLY by the harness). MP_SMTP_AUTH_ALLOW_INSECURE
          #    because the tunnel carries plaintext SMTP (no STARTTLS cert for its host).
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 \
            -e MP_SMTP_AUTH="ci:$SMTP_PW" \
            -e MP_SMTP_AUTH_ALLOW_INSECURE=true \
            axllent/mailpit:latest
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8025/api/v1/info >/dev/null 2>&1 && { echo "Mailpit API is up"; break; }
            sleep 1
          done

          # 2) Public TCP tunnel → Mailpit SMTP (:1025). Default ngrok; bore = no-account
          #    fallback. Swapping between them is this small, documented SINK_TUNNEL toggle.
          public_url=""
          case "$SINK_TUNNEL" in
            ngrok)
              [ -n "${NGROK_AUTHTOKEN:-}" ] || { echo "::error::NGROK_AUTHTOKEN is not set (or set repo variable SINK_TUNNEL=bore)"; exit 1; }
              curl -sSLo /tmp/ngrok.tgz https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
              sudo tar -xzf /tmp/ngrok.tgz -C /usr/local/bin
              ngrok config add-authtoken "$NGROK_AUTHTOKEN"
              ngrok tcp 1025 --log=stdout > /tmp/ngrok.log 2>&1 &
              echo "NGROK_PID=$!" >> "$GITHUB_ENV"
              # ngrok exposes a local admin API at :4040 whose /api/tunnels carries the
              # public tcp://host:port. Poll it until the tunnel is established.
              for _ in $(seq 1 30); do
                public_url="$(curl -fsS http://localhost:4040/api/tunnels 2>/dev/null | grep -oE 'tcp://[0-9a-zA-Z.-]+:[0-9]+' | head -1 || true)"
                [ -n "$public_url" ] && break
                sleep 1
              done
              [ -n "$public_url" ] || { echo "::error::ngrok tunnel did not come up"; echo '--- ngrok.log ---'; cat /tmp/ngrok.log || true; exit 1; }
              ;;
            bore)
              # No-account fallback: bore.pub assigns a random public port that forwards
              # to our local :1025. No token, no config. (github.com/ekzhang/bore)
              curl -sSLo /tmp/bore.tgz https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
              sudo tar -xzf /tmp/bore.tgz -C /usr/local/bin
              bore local 1025 --to bore.pub > /tmp/bore.log 2>&1 &
              echo "BORE_PID=$!" >> "$GITHUB_ENV"
              port=""
              for _ in $(seq 1 30); do
                port="$(grep -oE 'remote_port[=: ]+[0-9]+|bore\.pub:[0-9]+' /tmp/bore.log 2>/dev/null | grep -oE '[0-9]+' | head -1 || true)"
                [ -n "$port" ] && break
                sleep 1
              done
              [ -n "$port" ] || { echo "::error::bore tunnel did not come up"; echo '--- bore.log ---'; cat /tmp/bore.log || true; exit 1; }
              public_url="tcp://bore.pub:${port}"
              ;;
            *)
              echo "::error::unknown SINK_TUNNEL '$SINK_TUNNEL' (expected ngrok|bore)"; exit 1
              ;;
          esac

          host="$(printf '%s' "$public_url" | sed -E 's#^tcp://([^:]+):([0-9]+)$#\1#')"
          port="$(printf '%s' "$public_url" | sed -E 's#^tcp://([^:]+):([0-9]+)$#\2#')"
          [ -n "$host" ] && [ -n "$port" ] || { echo "::error::could not parse tunnel host:port from '$public_url'"; exit 1; }
          {
            echo "smtp_host=$host"
            echo "smtp_port=$port"
          } >> "$GITHUB_OUTPUT"

          echo "Public SMTP sink: ${host}:${port} → in-job Mailpit :1025 (API on localhost:8025)"

      # ── Point the STANDING workspace's BYO-SMTP (SSO-2917) at the tunnelled sink ──
      # Applied PER RUN because the tunnel is ephemeral. Done with the standalone
      # `workspace email-provider set` command (needs tenant:email.write) against the standing
      # workspace's gateway — the tenant-scoped API key CAN reach it directly (the previous WIF
      # identity could not, which is why the old flow smuggled SMTP config in via the recipe). The
      # SMTP password is passed through a 0600 temp FILE, never on argv (the CLI has no
      # `--smtp-password <value>` flag by design — SSO-1545 secret-safety).

      - name: Point the standing workspace BYO-SMTP at the tunnelled sink
        env:
          SINK_SMTP_HOST: ${{ steps.sink.outputs.smtp_host }}
          SINK_SMTP_PORT: ${{ steps.sink.outputs.smtp_port }}
        run: |
          set -euo pipefail
          [ -n "${SINK_SMTP_HOST:-}" ] && [ -n "${SINK_SMTP_PORT:-}" ] || { echo "::error::tunnel host/port missing"; exit 1; }
          pw_file="$(mktemp)"; chmod 600 "$pw_file"
          printf '%s' "$SMTP_PW" > "$pw_file"
          # CI plumbing, not part of the example: the workspace's real sender is whatever the customer configured.
          java -jar thoryn.jar workspace email-provider set \
            --smtp-host "$SINK_SMTP_HOST" --smtp-port "$SINK_SMTP_PORT" --smtp-username ci \
            --smtp-password-file "$pw_file" --transport-security none --allow-insecure \
            --from-address "$SMTP_FROM_ADDRESS" --enabled true --gateway "$THORYN_GATEWAY"
          rm -f "$pw_file"

      - name: Update the signed recipe catalog
        run: |
          set -euo pipefail
          java -jar thoryn.jar examples update

      # examples apply converges recipes/simple-signin/provision.yaml first (the client + the demo user on the
      # PRODUCTION plane, where the real verification email goes out), then the recipe's extra steps.
      - name: Apply the simple-signin recipe (provisions first) and resolve issuer/client
        id: apply
        run: |
          set -euo pipefail
          slug="$(jq -r '.workspace.slug' .thoryn/connection.json)"
          java -jar thoryn.jar examples apply "$RECIPE" \
            --set "workspaceSlug=${slug}" --set "demoEmail=${DEMO_EMAIL}" --environment production --yes
          java -jar thoryn.jar examples receipt "$RECIPE" --output json > /tmp/receipt.json
          client="$(jq -r '[.resources[]? | select(.kind=="application") | .id] | first // ""' /tmp/receipt.json)"
          [ -n "$client" ] || { echo "::error::could not parse the clientId from the recipe receipt"; cat /tmp/receipt.json; exit 1; }
          {
            echo "issuer=https://${slug}.hub.stg.thoryn.org"
            echo "client_id=$client"
            echo "workspace_slug=$slug"
          } >> "$GITHUB_OUTPUT"
          echo "Applied '$RECIPE' → client '$client' in workspace '$slug'"

      - name: Start the loopback relying-party
        env:
          THORYN_ISSUER: ${{ steps.apply.outputs.issuer }}
          THORYN_CLIENT_ID: ${{ steps.apply.outputs.client_id }}
          PORT: ${{ env.RP_PORT }}
        run: |
          node recipes/simple-signin/apps/loopback-rp/server.js &
          echo "RP_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${RP_PORT}/" >/dev/null 2>&1 && { echo "RP is up"; break; }
            sleep 1
          done

      - name: Run the Playwright harness
        env:
          THORYN_ISSUER: ${{ steps.apply.outputs.issuer }}
          THORYN_CLIENT_ID: ${{ steps.apply.outputs.client_id }}
          RP_BASE_URL: http://127.0.0.1:${{ env.RP_PORT }}
          IDENTITY_BASE_URL: ${{ env.IDENTITY_BASE_URL }}
          THORYN_JAR: ${{ github.workspace }}/thoryn.jar
          MAILPIT_BASE_URL: http://localhost:8025
          THORYN_CI_CLIENT_SECRET: ${{ secrets.THORYN_EXAMPLES_CI_CLIENT_SECRET }}
          THORYN_WORKSPACE_SLUG: ${{ steps.apply.outputs.workspace_slug }}
          THORYN_GATEWAY: ${{ env.THORYN_GATEWAY }}
          CI: "true"
        run: |
          set -euo pipefail
          export THORYN_API_KEY="$(jq -r '.auth.clientId' .thoryn/connection.json):${THORYN_CI_CLIENT_SECRET}"
          npm ci
          npx playwright install --with-deps chromium
          npm run test:simple

      - name: Upload Playwright report + generated E2E_RESULTS.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-e2e-playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            recipes/simple-signin/E2E_RESULTS.md
          if-no-files-found: warn
          retention-days: 14

      - name: Commit back the generated E2E_RESULTS.md
        if: always() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          FILE=recipes/simple-signin/E2E_RESULTS.md
          if git diff --quiet -- "$FILE"; then
            echo "E2E_RESULTS.md unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "thoryn-ci[bot]"
          git config user.email "ci@thoryn.io"
          git add "$FILE"
          git commit -m "chore(e2e): update simple-signin E2E_RESULTS.md from CI run ${{ github.run_id }} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # examples teardown destroys the provisioning (child-first; production-plane resources need the workspace-slug confirmation the CLI derives from the receipt).
      - name: Teardown (examples teardown + sink, tunnel, sender reset)
        if: always()
        run: |
          set -uo pipefail
          [ -n "${RP_PID:-}" ] && kill "$RP_PID" 2>/dev/null || true
          [ -n "${NGROK_PID:-}" ] && kill "$NGROK_PID" 2>/dev/null || true
          [ -n "${BORE_PID:-}" ] && kill "$BORE_PID" 2>/dev/null || true
          docker rm -f mailpit 2>/dev/null || true
          [ -f thoryn.jar ] || { echo "no CLI jar — nothing was provisioned"; exit 0; }
          java -jar thoryn.jar examples teardown "$RECIPE" || echo "::warning::examples teardown reported an error — check for a leaked client/user named for run $GITHUB_RUN_ID"
          slug="$(jq -r '.workspace.slug' .thoryn/connection.json)"
          java -jar thoryn.jar workspace email-provider reset --confirm "$slug" --gateway "$THORYN_GATEWAY" || true
